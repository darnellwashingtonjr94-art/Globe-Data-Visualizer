version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=cache
    depends_on:
      - cache

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_WS_URL=ws://localhost:8080/ws/topology

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
